name: Security scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  security-events: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          api-url:        ${{ vars.BREACHLENS_API_URL }}
          api-token:      ${{ secrets.BREACHLENS_API_TOKEN }}
          severity-gate:  HIGH
