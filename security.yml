name: BreachLens scan
on: [push, pull_request]
permissions:
  security-events: write   # only needed if you upload SARIF in this same job

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger BreachLens scan + wait + gate
        env:
          API_URL:   ${{ vars.BREACHLENS_API_URL }}
          API_TOKEN: ${{ secrets.BREACHLENS_API_TOKEN }}
        run: |
          set -euo pipefail
          PR=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")

          # 1. Trigger scan (auto-discovers repo)
          BODY=$(jq -nc --arg full "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg pr "$PR" \
            '{githubFullName:$full, commitSha:$sha, branch:$branch}
             + (if $pr != "" then {prNumber: ($pr | tonumber)} else {} end)')
          SCAN_ID=$(curl -fsS -X POST "$API_URL/api/scans/from-github" \
            -H "Authorization: Bearer $API_TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" | jq -r '.scanJobId')

          # 2. Poll
          while :; do
            STATUS=$(curl -fsS "$API_URL/api/scans/$SCAN_ID" \
              -H "Authorization: Bearer $API_TOKEN" | jq -r '.status')
            echo "scan $SCAN_ID: $STATUS"
            [[ "$STATUS" == "COMPLETED" || "$STATUS" == "FAILED" ]] && break
            sleep 15
          done
          [[ "$STATUS" == "FAILED" ]] && exit 1

          # 3. Fetch SARIF + apply gate
          curl -fsS "$API_URL/api/scans/$SCAN_ID/export.sarif" \
            -H "Authorization: Bearer $API_TOKEN" -o breachlens.sarif
          HIGH=$(jq '[.runs[].results[] | select(.properties.severity=="HIGH" or .properties.severity=="CRITICAL")] | length' breachlens.sarif)
          [[ $HIGH -gt 0 ]] && { echo "::error::$HIGH HIGH+ findings"; exit 1; } || true

      - name: Upload SARIF
        if: always() && hashFiles('breachlens.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: breachlens.sarif
